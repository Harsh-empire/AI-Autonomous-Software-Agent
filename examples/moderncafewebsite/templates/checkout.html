<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        <form action="{{ url_for('process_payment') }}" method="post">
            <div class="form-group">
                <label for="card_number">Card Number</label>
                <input type="text" class="form-control" id="card_number" name="card_number" required>
            </div>
            <div class="form-group">
                <label for="card_expiry">Card Expiry</label>
                <input type="text" class="form-control" id="card_expiry" name="card_expiry" required>
            </div>
            <div class="form-group">
                <label for="card_cvc">CVC</label>
                <input type="text" class="form-control" id="card_cvc" name="card_cvc" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Payment</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
