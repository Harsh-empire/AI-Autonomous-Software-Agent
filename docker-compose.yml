services:
  ollama:
    image: ollama/ollama:latest
    container_name: aegis-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G

  ide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-ide
    ports:
      # Bound strictly to 127.0.0.1 to prevent unauthorized external access
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - AEGIS_MODEL=qwen2.5-coder:7b
      - PLAYBOOK=on
    depends_on:
      - ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    # Container hardening. This is a container boundary, NOT a full sandbox: the generated
    # apps run inside this same container (see README, "Security model").
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    restart: unless-stopped

volumes:
  ollama_data:
